<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SRS Video Pusher</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:monospace; padding:20px; }
  video { width:320px; height:480px; display:none; }
  .status { color:#0f0; }
  .error { color:#f44; }
</style>
</head>
<body>
<h3>SRS WebRTC Video Push</h3>
<p id="msg" class="status">Starting...</p>

<video id="src" src="/avatar-videos/greeting.webm" muted loop playsinline autoplay crossorigin="anonymous"></video>
<video id="preview" autoplay muted playsinline style="width:160px;height:240px;display:none;position:fixed;bottom:10px;right:10px;"></video>

<script>
const SRS_API = 'http://localhost:1985';
const STREAM_ID = 'ai_avatar';
const msg = document.getElementById('msg');
const srcVideo = document.getElementById('src');
const preview = document.getElementById('preview');

function log(s, isErr) {
  msg.textContent = s;
  msg.className = isErr ? 'error' : 'status';
}

async function start() {
  try {
    log('Loading video...');
    await srcVideo.play();
    log('Video playing, starting WebRTC push...');

    // Capture video as MediaStream
    const stream = srcVideo.captureStream(25);
    
    // Create SRS stream via API
    log('Creating SRS stream...');
    const createRes = await fetch(`${SRS_API}/api/v1/clients`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        api: SRS_API,
        clientip: '127.0.0.1',
        sdp: '' // will be set via WHIP
      })
    });
    log(`Stream API: ${createRes.status}`);

    // WHIP publish to SRS
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:localhost:8000' }]
    });
    
    stream.getTracks().forEach(track => pc.addTrack(track, stream));
    
    pc.oniceconnectionstatechange = () => {
      log(`ICE state: ${pc.iceConnectionState}`);
      if (pc.iceConnectionState === 'connected') {
        log('WebRTC connected! Stream: webrtc://localhost:1985/live/' + STREAM_ID);
      }
    };

    // Create offer
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // Send WHIP request (SRS WHIP endpoint)
    const whipUrl = `http://localhost:1985/rtc/v1/whip/?app=live&stream=${STREAM_ID}`;
    const whipRes = await fetch(whipUrl, {
      method: 'POST',
      headers: {'Content-Type': 'application/sdp'},
      body: pc.localDescription.sdp
    });

    if (whipRes.ok) {
      const answerSdp = await whipRes.text();
      await pc.setRemoteDescription(new RTCSessionDescription({
        type: 'answer', sdp: answerSdp
      }));
      log(`Published! WebRTC: webrtc://localhost:1985/live/${STREAM_ID}`, false);
    } else {
      log(`WHIP failed: ${whipRes.status} ${whipRes.statusText}`, true);
    }

    // Show preview
    preview.style.display = 'block';
    preview.srcObject = stream;

  } catch (e) {
    log(`Error: ${e.message}`, true);
  }
}

srcVideo.onloadedmetadata = () => start();
</script>
</body>
</html>
